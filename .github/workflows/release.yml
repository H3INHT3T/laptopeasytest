name: Build & Release LaptopBench QC (Windows + macOS Universal)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            label: Windows-x64
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            label: macOS-Universal

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Verify Rust compilation
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build & Publish to GitHub Releases (.msi/.exe on Windows, Universal .dmg on macOS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "LaptopBench QC v__VERSION__"
          releaseBody: |
            ## LaptopBench QC v__VERSION__
            100% offline cross-platform laptop hardware diagnostics & QC certification suite built with Rust + Tauri v2.

            ### Downloads
            - **Windows (x64):** `.exe` (NSIS Setup) or `.msi` installer (requests Administrator UAC for full NVMe/SATA SMART, BitLocker & Event Logs)
            - **macOS (Universal — Apple Silicon & Intel):** `.dmg` disk image

            ### Included Diagnostics
            1. System Specifications & Gaming/dGPU Auto-Detection
            2. Lock, MDM / DEP, Activation Lock, OEM License, BitLocker/FileVault & TPM/Secure Boot Audit
            3. Battery Health Report, Cycle Count & Live Charge/Discharge Wattage Monitor
            4. System Error Logs (Windows Event Logs / Minidumps & macOS Kernel Panics)
            5. Fullscreen Display Check (15 MonitorTest-style patterns + Motion Hz)
            6. Offline Keyboard Test (Windows Compact, Full+Numpad, MacBook + Chatter Detector)
            7. SSD SMART Health & Non-Destructive Speed Benchmark
            8. Multi-Threaded RAM Pattern Stress Test (TestMem5-style)
            9. Two-Stage Fingerprint & Face ID / Touch ID Verification
            10. Camera Preview & Microphone Waveform + Loopback Test
            11. CPU & Memory Performance Benchmark
            12. Native `wgpu` FurMark-Style 3D GPU Stress Test with Thermal Cutoff
            13. Pre-Report Ports & Speaker Reminder (with L/R Stereo Chimes) + Branded PDF / HTML / JSON QC Certificate
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LaptopBench-QC-${{ matrix.label }}
          path: |
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
          if-no-files-found: ignore
